---
# The SA doubles as the OAuth client for oauth-proxy (--openshift-service-account).
# The redirect annotation lets the OAuth server send the browser back to the route.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab
  namespace: heron
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"lab"}}
