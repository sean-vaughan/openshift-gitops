---
# Routes with spec.tls.externalCertificate require the ingress router to be
# granted read access to the referenced secret in the app namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-read-lab-tls
  namespace: heron
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["lab-tls"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-read-lab-tls
  namespace: heron
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-read-lab-tls
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
